name: Check for new Odyssey show dates

# No schedule here on purpose. The hourly check runs as an Azure Function (see
# README); GitHub's scheduler was dropping ~3 of every 4 slots, and leaving it
# on meant a second watcher with its own state emailing duplicates.
# Kept dispatch-only as a manual fallback -- those runs are never throttled.
on:
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send an alert for the latest date (tests the email path)'
        type: boolean
        default: false

# Never let two runs race on the state commit.
concurrency:
  group: odyssey-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for new show dates
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          FORCE_ALERT: ${{ inputs.force_alert }}
        run: python3 check_odyssey.py --verbose

      # Runs even if the check failed, so a queued (unsent) alert is persisted
      # and retried next hour rather than lost with the failed run.
      - name: Commit updated state
        if: always()
        run: |
          if git diff --quiet -- state.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "odyssey-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(python3 -c "import json;s=json.load(open('state.json'));print('latest',s['latest_date'])")"
          git pull --rebase --autostash
          git push
